[project]
name = "dadbox"
version = "0.1.0"
description = "Voice messaging box for a parent and child who live apart"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "cryptography>=42",   # AES-256-GCM for the container (ADR 0017)
]

[project.optional-dependencies]
# Only on the Pi. The Mac runs the pure logic and the fakes.
pi = ["gpiozero>=2.0", "smbus2>=0.4"]   # lgpio comes from apt (python3-lgpio)
dev = ["pytest>=8"]

[project.scripts]
dadboxctl = "dadbox.ctl:main"
