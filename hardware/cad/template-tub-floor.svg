<svg xmlns="http://www.w3.org/2000/svg" width="212mm" height="172mm" viewBox="0 0 212 172" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="212" height="172" fill="white"/>
<text x="12" y="8" font-size="4.2" font-weight="bold">DadBox - tub floor, seen from above, 1:1</text>
<text x="12" y="13.5" font-size="2.8">Dashed = inside walls. Trim to the dashed line, lay it in the tub, place the parts, mark, then drill from inside.</text>
<g transform="translate(12,22)"><rect x="0" y="0" width="188" height="120" rx="4" fill="none" stroke="black" stroke-width="0.35"/><rect x="4.0" y="4.0" width="180" height="112" fill="none" stroke="black" stroke-width="0.15" stroke-dasharray="1.5 1"/><text x="94.0" y="125" font-size="3" text-anchor="middle">FRONT</text><rect x="114.00" y="9.00" width="56.70" height="85.00" fill="none" stroke="black" stroke-width="0.3"/><text x="116.00" y="13.00" font-size="2.4">Modem HAT - mark its 4 holes through the board, drill 2.7 mm</text><rect x="14.00" y="35.00" width="18.00" height="19.00" fill="none" stroke="black" stroke-width="0.3"/><text x="16.00" y="39.00" font-size="2.4">Amp - foam tape</text><rect x="70.00" y="34.00" width="35.00" height="40.00" fill="none" stroke="black" stroke-width="0.3"/><text x="72.00" y="38.00" font-size="2.4">Foam block</text><circle cx="12" cy="12" r="5" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="1 1"/><circle cx="176" cy="12" r="5" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="1 1"/><circle cx="12" cy="108" r="5" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="1 1"/><circle cx="176" cy="108" r="5" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="1 1"/><text x="12" y="101" font-size="2.2">rubber feet go underneath, at the corners</text></g>
<g transform="translate(12,160)"><rect x="0" y="0" width="50" height="3" fill="black"/><text x="0" y="8" font-size="2.8">50 mm - print at 100 % (actual size) and measure this bar first</text></g>
</svg>
